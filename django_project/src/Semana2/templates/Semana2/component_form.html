{% extends "base.html" %}

{% block title %}Agregar componente{% endblock %}

{% block content %}
    <h2 class="mb-4">Agregar componente</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'component_list' %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
{% endblock %}
